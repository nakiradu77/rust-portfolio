[[hooks]]
stage = "pre_build"
command = "npx"
command_arguments = ["-y", "@tailwindcss/cli", "-i", "styles/input.css", "-o", "styles/tailwind-output.css", "--minify"]

[hooks.windows]
stage = "pre_build"
command = "powershell"
command_arguments = [
    "-Command",
    "if (-not (Test-Path node_modules)) { npm install }; npx -y @tailwindcss/cli -i styles/input.css -o styles/tailwind-output.css --minify"
]