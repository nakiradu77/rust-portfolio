[package]
name = "leptos-portfolio"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos                   = { version = "0.8.17", features = ["csr"] }
leptos_meta              = { version = "0.8.6" }
wasm-bindgen             = "0.2"
console_error_panic_hook = "0.1"
serde                    = { version = "1", features = ["derive"] }
serde_json               = "1"
console_log = "1.0.0"
log = "0.4.29"
js-sys = "0.3.95"
gloo-timers = { version = "0.4.0", features = ["futures"] }

[dependencies.web-sys]
version = "0.3"
features = ["Window", "Storage", "NodeList"]
# All cursor/rAF/DOM work is done inside wasm_bindgen inline_js blocks in gsap.rs,
# so we only need Window for set_timeout_with_callback_and_timeout_and_arguments_0.

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
debug = false

[profile.dev]
debug = true
panic         = "abort"
